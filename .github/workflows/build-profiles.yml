name: Build profiles

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Enforce the release gates and publish a release-packaged FAP"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-profiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile:
          - nfc
          - usb
          - full
    env:
      UV_PYTHON: "3.14"
      ZEROFIDO_PROFILE: ${{ matrix.profile }}
      ZEROFIDO_RELEASE_DIAGNOSTICS: "0"
      ZEROFIDO_USB_DIAGNOSTICS: "0"
      ZEROFIDO_AUTO_ACCEPT_REQUESTS: "0"
      ZEROFIDO_DEV_SCREENSHOT: "0"
      ZEROFIDO_DEV_FIDO2_1: "0"
      ZEROFIDO_PACKED_ATTESTATION: "1"
      ZEROFIDO_VAULT_PIN_KEK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.14

      - name: Sync tools
        run: uv sync --locked

      - name: Check release build defaults
        run: uv run python -m unittest tests.app.test_application_manifest

      - name: Point ufbt at Unleashed SDK (release channel, currently unlshd-093)
        run: |
          uv run python -m ufbt update \
            --index-url=https://up.unleashedflip.com/directory.json \
            --channel=release

      - name: Build profile
        run: uv run python -m ufbt

      - name: Package release FAP
        if: ${{ inputs.release }}
        run: |
          set -euo pipefail
          uv run python host_tools/package_release.py \
            --skip-build \
            --allow-prebuilt-input \
            --fap dist/zerofido.fap \
            --output-fap dist/zerofido-${{ matrix.profile }}-pin-release.fap
          uv run python host_tools/check_fap_icon.py \
            --fap dist/zerofido-${{ matrix.profile }}-pin-release.fap
          wc -c dist/zerofido-${{ matrix.profile }}-pin-release.fap

      - name: Upload release FAP artifact
        if: ${{ inputs.release }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: zerofido-${{ matrix.profile }}-pin-release
          if-no-files-found: error
          path: dist/zerofido-${{ matrix.profile }}-pin-release.fap

      - name: Package PIN FAP
        if: ${{ !inputs.release }}
        run: |
          uv run python host_tools/package_release.py \
            --skip-build \
            --allow-prebuilt-input \
            --fap dist/zerofido.fap \
            --output-fap dist/zerofido-${{ matrix.profile }}-pin.fap \
            || echo "::warning::release payload gate failed - expected for a dev build"
          test -f dist/zerofido-${{ matrix.profile }}-pin.fap

      - name: Upload FAP artifacts
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: zerofido-${{ matrix.profile }}-pin
          if-no-files-found: error
          path: dist/zerofido-${{ matrix.profile }}-pin.fap
